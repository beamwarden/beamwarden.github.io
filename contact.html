<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BEAMWARDEN | Contact Us</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: #0a0e14;
            background-image: url('beamwarden_logo.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;

            color: #58a6ff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 20, 0.85);
            z-index: -1;
        }

        .container {
            border: 1px solid #f0883e;
            padding: 2rem;
            text-align: center;
            width: 100%;
            max-width: 600px;
            background: rgba(10, 14, 20, 0.6);
            box-shadow: 0 0 30px rgba(240, 136, 62, 0.15);
        }

        h1 {
            color: #f0883e;
            letter-spacing: 6px;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(240, 136, 62, 0.5);
            font-size: clamp(1.8rem, 5vw, 2.5rem);
        }

        .tagline {
            color: #c9d1d9;
            font-style: italic;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
        }

        form {
            text-align: left;
            margin-top: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #f0883e;
            font-size: 0.9rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1.25rem;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            border-radius: 4px;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background: #f0883e;
            color: #0a0e14;
            border: none;
            padding: 0.75rem 2rem;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2px;
            transition: background 0.2s ease;
            width: 100%;
            border-radius: 4px;
        }

        button:hover {
            background: #ff9f5a;
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            button {
                padding: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CONTACT</h1>
        <p class="tagline">Would You Like to Know More</p>

        <form id="contactForm">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="org">Organization (optional)</label>
            <input id="org" name="organization" type="text">

            <label for="message">How can we help?</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">SUBMIT</button>
        </form>

        <a class="back-link" href="/">← Back to Beamwarden</a>
    </div>

    <script>
        const form = document.getElementById("contactForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const payload = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                organization: document.getElementById("org").value,
                message: document.getElementById("message").value
            };

            try {
                const res = await fetch("https://beamwarden.com/contact", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("Message sent. We'll be in touch.");
                    form.reset();
                } else {
                    alert("Something went wrong. Please try again later.");
                }
            } catch (err) {
                alert("Network error. Please try again later.");
            }
        });
    </script>
</body>

</html>

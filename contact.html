<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BEAMWARDEN | Contact</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../beamwarden.css">
</head>

<body>

    <div class="container fade-1">
        <h1>CONTACT BEAMWARDEN</h1>

        <form id="contactForm" action="https://api.beamwarden.com/contact" method="POST">

            <label for="name">Name</label>
            <input id="name" name="name" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="organization">
                Organization <span class="optional">(optional)</span>
            </label>
            <input id="organization" name="organization">

            <label for="phone">
                Phone Number <span class="optional">(optional)</span>
            </label>
            <input id="phone" name="phone" type="tel">

            <!-- Proper hidden honeypot -->
            <div class="honeypot" style="display:none;">
                <label for="company">Company</label>
                <input id="company" name="company">
            </div>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">SEND MESSAGE</button>

            <div id="successBanner" class="banner success">Your message has been sent successfully.</div>
            <div id="errorBanner" class="banner error">Something went wrong. Please try again.</div>
        </form>

        <a class="back-link" href="/">← Back to Home</a>
    </div>

    <script>
        const form = document.getElementById("contactForm");
        const successBanner = document.getElementById("successBanner");
        const errorBanner = document.getElementById("errorBanner");

        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phone");

        // Patterns
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phonePattern = /^\+?[0-9\s\-().]{7,20}$/;

        // Validation helpers
        function validateEmail(value) {
            return emailPattern.test(value);
        }

        function validatePhone(value) {
            return phonePattern.test(value);
        }

        function showError(message) {
            errorBanner.textContent = message;
            errorBanner.style.display = "block";
        }

        function clearError() {
            errorBanner.style.display = "none";
        }

        // Live validation that begins 1500ms after FIRST character
        function attachLiveValidation(input, validator, message) {
            input.addEventListener("input", () => {
                // First character typed → start timer
                if (!input._hasTyped) {
                    input._hasTyped = true;
                    input._timer = setTimeout(() => {
                        if (input.value && !validator(input.value)) {
                            input.style.borderColor = "#f85149";
                            showError(message);
                        } else {
                            input.style.borderColor = "";
                            clearError();
                        }
                    }, 1500);
                    return;
                }

                // After first validation → debounce normally
                clearTimeout(input._timer);
                input._timer = setTimeout(() => {
                    if (input.value && !validator(input.value)) {
                        input.style.borderColor = "#f85149";
                        showError(message);
                    } else {
                        input.style.borderColor = "";
                        clearError();
                    }
                }, 1500);
            });
        }

        // Attach live validation
        attachLiveValidation(emailInput, validateEmail, "Please enter a valid email address.");
        attachLiveValidation(phoneInput, validatePhone, "Please enter a valid international phone number.");

        // Normalize phone to E.164-ish
        function normalizePhone(raw) {
            if (!raw) return "";
            let cleaned = raw.replace(/[^\d+]/g, "");
            if (!cleaned.startsWith("+")) cleaned = "+1" + cleaned;
            return cleaned;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            successBanner.style.display = "none";
            clearError();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Honeypot
            if (data.company) return;

            // Email validation
            if (!validateEmail(data.email)) {
                showError("Please enter a valid email address.");
                return;
            }

            // Phone validation (optional)
            if (data.phone && !validatePhone(data.phone)) {
                showError("Please enter a valid international phone number.");
                return;
            }

            // Normalize phone
            data.phone = normalizePhone(data.phone);

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data),
                });

                if (response.ok) {
                    successBanner.style.display = "block";
                    form.reset();

                    // Reset live validation state
                    emailInput._hasTyped = false;
                    phoneInput._hasTyped = false;
                    emailInput.style.borderColor = "";
                    phoneInput.style.borderColor = "";
                } else {
                    showError("Something went wrong. Please try again.");
                }
            } catch {
                showError("Something went wrong. Please try again.");
            }
        });
    </script>

</body>

</html>
